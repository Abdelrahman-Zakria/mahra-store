<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Mahra Store</title>
  <script type="text/javascript">
    // GitHub Pages 404 Hack to handle Single Page Apps with path-based routing.
    // This script takes the current URL and converts it into a query parameter
    // that the index.html can then parse and use to navigate to the correct route.
    var pathSegmentsToKeep = 0;

    var l = window.location;
    l.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
      l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
      (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
      l.hash
    );
  </script>
</head>
<body>
</body>
</html>

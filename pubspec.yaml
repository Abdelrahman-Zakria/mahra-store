name: mahra_store
description: MAHRA EG - Premium E-Commerce Application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Dependency Injection
  get_it: ^7.6.4

  # Navigation
  go_router: ^12.1.1

  # UI
  cached_network_image: ^3.3.0
  flutter_svg: ^2.0.9
  shimmer: ^3.0.0
  smooth_page_indicator: ^1.1.0

  # Utils
  shared_preferences: ^2.2.2
  dartz: ^0.10.1
  uuid: ^4.2.1
  image_picker: ^1.2.1
  url_launcher: ^6.2.5

  # Backend (Supabase)
  supabase_flutter: ^2.0.0

  # Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # Data Visualization
  fl_chart: ^0.66.0
  gh_pages: ^0.1.1

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/
    - assets/products/
    - assets/logo/